services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: messi_wc_2022
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messi_wc_2022"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
