<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playbook · La memoria albiceleste</title>
<style>
@font-face{font-family:Manrope;src:url('./playbook-assets/Manrope.woff2')}@font-face{font-family:Barlow;src:url('./playbook-assets/BarlowCondensed-Bold.ttf')}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0b203b;color:#f2eee3;font:16px/1.55 Manrope,Arial,sans-serif}button{font:inherit;color:inherit}.hero{height:100svh;min-height:620px;position:relative;display:flex;align-items:flex-end;padding:7vw 8vw 10vh;overflow:hidden}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;z-index:0}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#071c2ddd,#071c2d55 58%,transparent),linear-gradient(0deg,#0b203b 0%,transparent 62%);z-index:1}.hero-copy{position:relative;z-index:2;max-width:750px}.hero h1{font:clamp(4.5rem,10vw,9rem)/.82 Barlow,sans-serif;text-transform:uppercase;margin:20px 0}.hero h1 span{display:block}.hero h1 em{font-style:normal;color:#b8e4ed}.hero p{font-size:clamp(1rem,1.5vw,1.2rem);max-width:36ch;color:#d1dbe3}.start{display:inline-flex;margin-top:20px;align-items:center;gap:12px;color:#f2eee3;text-decoration:none}.start b{width:40px;height:40px;border:1px solid #ffffff66;border-radius:50%;display:grid;place-items:center;font-size:1.2rem}.scene{min-height:calc(100svh - 0px);padding:5vh 8vw 170px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:5vw;align-items:center;position:relative}.photo{margin:0;position:relative;height:min(65vh,680px);min-height:340px;overflow:hidden;background:#183c5a}.photo img{width:100%;height:100%;object-fit:cover}.copy{max-width:510px}.location{color:#b8e4ed;text-transform:uppercase;letter-spacing:.13em;font-size:.78rem}.copy h2{font:clamp(3.4rem,7vw,6rem)/.86 Barlow,sans-serif;text-transform:uppercase;margin:18px 0}.copy h2 span{display:block}.copy p{font-size:1.05rem;color:#c2cfdc;max-width:35ch}.timeline-wrap{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:18px max(5vw,24px) calc(18px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#081b31 72%,#081b31ee 88%,transparent);}.timeline{max-width:1200px;margin:auto;position:relative}.rail{height:1px;background:#ffffff50;position:absolute;top:18px;left:0;right:0}.progress{position:absolute;left:0;top:17px;height:3px;width:0;background:#b8e4ed;transition:width .3s}.years{position:relative;display:flex;justify-content:space-between;gap:0;overflow-x:auto;scrollbar-width:none}.years::-webkit-scrollbar{display:none}.year{flex:1;min-width:57px;border:0;background:none;padding:0 2px;cursor:pointer;display:grid;justify-items:center;gap:8px;color:#9cabb9;font-size:.68rem;font-variant-numeric:tabular-nums}.dot{height:11px;width:11px;border:1px solid #c2cfdc;border-radius:50%;background:#0b203b;z-index:1;transition:transform .2s,background .2s,box-shadow .2s}.year[aria-current=true]{color:#f2eee3;font-weight:700}.year[aria-current=true] .dot{background:#b8e4ed;border-color:#b8e4ed;transform:scale(1.5);box-shadow:0 0 0 5px #b8e4ed26}.year:hover .dot{box-shadow:0 0 0 5px #b8e4ed26}.timeline-caption{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:13px auto 0;color:#c2cfdc;font-size:.75rem}.timeline-caption strong{font-weight:600;color:#f2eee3}.hint{color:#94a5b5}
@media(max-width:700px){.hero{min-height:640px;padding:0 7vw 12vh;align-items:flex-end}.hero:after{background:linear-gradient(0deg,#0b203b 0%,#0b203b9c 34%,#0b203b05 85%)}.hero img{object-position:58% 35%}.hero h1{font-size:clamp(4.1rem,16vw,6rem)}.scene{display:flex;flex-direction:column;align-items:stretch;padding:28px 7vw 150px;gap:22px;min-height:100svh}.photo{height:42vh;min-height:260px}.copy h2{font-size:clamp(3.4rem,14vw,5rem);margin:12px 0}.copy p{font-size:.95rem}.timeline-wrap{padding:14px 16px calc(13px + env(safe-area-inset-bottom))}.years{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory}.year{flex:0 0 56px;scroll-snap-align:center}.rail{right:auto;width:max(100%,calc(56px * 15))}.progress{max-width:none}.timeline-caption{margin-top:11px}.hint{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* Revised editorial layout: restrained foreground copy and a real perspective stage. */
.scene{grid-template-columns:minmax(310px,.8fr) minmax(0,1.2fr);gap:4vw;padding:7vh 8vw 156px;overflow:hidden}
.copy{position:relative;z-index:3;max-width:520px}
.scene-meta{display:flex;align-items:baseline;gap:24px;margin:0 0 18px}.year-display{font:clamp(6rem,13vw,11rem)/.72 Barlow,sans-serif;color:#fff;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:0}
.location{margin:0;color:#b8e4ed;text-transform:uppercase;letter-spacing:.15em;font-size:.875rem}
.copy h2{font:clamp(3.4rem,6vw,6rem)/.86 Barlow,sans-serif;text-transform:uppercase;margin:14px 0 20px;max-width:8ch}
.copy p{font-size:1.05rem;color:#c2cfdc;max-width:33ch}
.stage{height:min(68vh,680px);min-height:380px;position:relative;perspective:1200px;perspective-origin:50% 46%;transform-style:preserve-3d}
.depth-card,.photo{position:absolute;top:50%;left:50%;margin:0;overflow:hidden;background:#142f4d;backface-visibility:hidden}
.depth-card{width:31%;height:64%;z-index:0;opacity:.5;filter:saturate(.72);transform-style:preserve-3d}
.depth-card img,.photo img{width:100%;height:100%;object-fit:cover}
.depth-card.before{transform:translate(-137%,-50%) rotateY(26deg) translateZ(-115px) scale(.82);object-position:60% center}
.depth-card.after{transform:translate(37%,-50%) rotateY(-26deg) translateZ(-115px) scale(.82);object-position:center}
.photo{width:73%;height:82%;z-index:2;transform:translate(-50%,-50%) translateZ(55px) rotateY(-3deg)}
.stage:before{content:"";position:absolute;inset:12% 12% 5%;background:radial-gradient(ellipse,#24506c70,transparent 70%);transform:translateZ(-160px);pointer-events:none}
.year{min-width:54px}.year[aria-current=true]{color:#fff}.timeline-caption strong{color:#fff}.timeline-caption{color:#c2cfdc}
.start:focus-visible,.year:focus-visible{outline:3px solid #b8e4ed;outline-offset:4px}
@media(hover:hover) and (pointer:fine){.year:hover .dot{transform:scale(1.35)}}
@media(max-width:760px){.scene{display:flex;flex-direction:column-reverse;align-items:stretch;justify-content:center;padding:30px 7vw 150px;gap:16px;min-height:100svh}.stage{height:42vh;min-height:250px;max-height:440px;margin:0 -4vw}.photo{width:72%;height:87%;transform:translate(-50%,-50%) translateZ(35px) rotateY(-2deg)}.depth-card{width:33%;height:66%}.depth-card.before{transform:translate(-124%,-50%) rotateY(24deg) translateZ(-90px) scale(.78)}.depth-card.after{transform:translate(24%,-50%) rotateY(-24deg) translateZ(-90px) scale(.78)}.copy{padding:0 2vw}.scene-meta{gap:18px;margin-bottom:12px}.year-display{font-size:clamp(5.4rem,20vw,8rem)}.location{font-size:.72rem}.copy h2{font-size:clamp(3.2rem,12vw,4.8rem);margin:9px 0 12px;max-width:none}.copy p{font-size:.92rem;margin:8px 0}.year{flex:0 0 56px}.rail{width:840px}.timeline-caption{margin-top:10px}}
@media(max-width:380px){.stage{height:37vh;min-height:220px}.copy h2{font-size:3rem}.year-display{font-size:5rem}}
@media(prefers-reduced-motion:reduce){.progress,.dot{transition:none!important}}
</style>
</head>
<body>
<main>
<section class="hero" id="inicio"><img src="./memoria/seleccion/mundial-2022.jpg" alt="Messi levanta la Copa del Mundo en Lusail"><div class="hero-copy"><h1><span>El peso de</span><span>la <em>gloria</em></span></h1><p>No empezó con una copa.<br>Empezó con las ganas de volver.</p><a class="start" href="#comienzos"><b aria-hidden="true">↓</b>Entrar a la historia</a></div></section>
<section class="scene" id="comienzos"><div class="copy"><div class="scene-meta"><p class="year-display">2005</p><div class="location">Rosario</div></div><h2><span>Una camiseta</span><span>Toda una vida</span></h2><p>Del dieciocho al diez. El sueño apenas empezaba.</p></div><div class="stage" role="group" aria-label="Composición fotográfica con profundidad tridimensional"><figure class="depth-card before"><img src="./memoria/seleccion/mundial-2022.jpg" alt="" aria-hidden="true"></figure><figure class="photo"><img src="./memoria/seleccion/debut-2005.jpg" alt="El joven Messi durante su debut con Argentina ante Hungría en 2005"></figure><figure class="depth-card after"><img src="./memoria/seleccion/mundial-2006.webp" alt="" aria-hidden="true"></figure></div></section>
</main>
<div class="timeline-wrap"><nav class="timeline" aria-label="Línea de tiempo"><div class="rail"></div><div class="progress" id="progress"></div><div class="years" id="years"></div></nav><div class="timeline-caption"><span><strong id="active-year">2005</strong><span id="active-place"> · Rosario</span></span><span class="hint">Selecciona un año para recorrer la historia</span></div></div>
<script>
const moments=[['2005','Rosario'],['2006','Gelsenkirchen'],['2008','Pekín'],['2010','Ciudad del Cabo'],['2011','Santa Fe'],['2012','Nueva Jersey'],['2014','Maracaná'],['2015','Santiago'],['2016','East Rutherford'],['2018','Kazán'],['2021','Maracaná'],['2022','Wembley'],['2022','Lusail'],['2024','Miami'],['2026','Nueva Jersey']];
const nav=document.querySelector('#years'),progress=document.querySelector('#progress');let selected=0;
moments.forEach(([year,place],i)=>{const button=document.createElement('button');button.className='year';button.type='button';button.setAttribute('aria-label',year+' · '+place);button.setAttribute('aria-current',String(i===0));button.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+year+'</span>';button.addEventListener('click',()=>{selected=i;nav.querySelectorAll('.year').forEach((item,j)=>item.setAttribute('aria-current',String(j===i)));document.querySelector('#active-year').textContent=year;document.querySelector('#active-place').textContent=' · '+place;progress.style.width=(i/(moments.length-1)*100)+'%';button.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});if(i===0)document.querySelector('#comienzos').scrollIntoView({behavior:'smooth'});else document.querySelector('#active-year').animate([{opacity:.4},{opacity:1}],{duration:220});});nav.append(button)});
const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){selected=0;progress.style.width='0%';nav.querySelectorAll('.year').forEach((b,i)=>b.setAttribute('aria-current',String(i===0)));document.querySelector('#active-year').textContent='2005';document.querySelector('#active-place').textContent=' · Rosario'}},{threshold:.35});observer.observe(document.querySelector('#comienzos'));
</script>
</body>
